<!DOCTYPE html>
<html lang="en">
<head>
<title>Produce</title>
<link rel="stylesheet" href="css/produce.css">
</head>
<body>

<header>
    <div class="logo">World Peas</div>

    <nav>
        <a href="#">Shop</a>
        <a href="#">Newstand</a>
        <a href="#">Who we are</a>
        <a href="#">My profile</a>
        <button class="basket">Basket (3)</button>
    </nav>
</header>

<section class="title-section">

    <div class="title">
        <h1>Produce</h1>
        <p><strong>Fresh</strong> &nbsp;—&nbsp; August 21, 2023</p>
    </div>

    <div class="filters">
        <button class="active">Default</button>
        <button>A-Z</button>
        <button>List view</button>
    </div>

</section>

<hr>

<section class="products">

    <div class="card">
        <img src="images/heirloom-tomato.jpg" alt="Tomato">

        <div class="card-content">
            <h3>Heirloom tomato</h3>
            <p class="price">$5.99 / lb</p>
            <p class="location">Grown in San Juan Capistrano, CA</p>
        </div>
    </div>

    <div class="card">
        <img src="images/organic-ginger.jpg" alt="Ginger">

        <div class="card-content">
            <h3>Organic ginger</h3>
            <p class="price">$12.99 / lb</p>
            <p class="location">Grown in Huntington Beach, CA</p>
        </div>
    </div>
    <div class="card">
        <img src="images/sweet-onion.jpg" alt="Onion">

        <div class="card-content">
            <h3>Sweet onion</h3>
            <p class="price">$2.99 / lb</p>
            <p class="location">Grown in Imperial, CA</p>
        </div>
    </div>

</section>

</body>
</html>
