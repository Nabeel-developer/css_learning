<!DOCTYPE html>
<html>
<head>
    <title>World Peas Basket</title>
    <link rel="stylesheet" href="css/baskit.css">
</head>
<body>

    <nav>
        <div class="logo">World Peas</div>

        <ul>
            <li><a href="#">Shop</a></li>
            <li><a href="#">Newstand</a></li>
            <li><a href="#">Who we are</a></li>
            <li><a href="#">My profile</a></li>
            <li><button>Basket (3)</button></li>
        </ul>
    </nav>

    <div class="container">

        <h1>Basket <span>3 items</span></h1>

        <hr>

        <div class="main">

            <div class="products">

                <div class="card">
                    <img src="images/heirloom-tomato.jpg" alt="">
                    <div class="info">
                        <h3>Heirloom tomato</h3>
                        <p class="price">$5.99 / lb</p>
                        <button class="qty">1 lb</button>
                    </div>
                    <h2>$5.99</h2>
                </div>

                <div class="card">
                    <img src="images/organic-ginger.jpg" alt="">
                    <div class="info">
                        <h3>Organic ginger</h3>
                        <p class="price">$12.99 / lb</p>
                        <button class="qty">0.5 lb</button>
                    </div>
                    <h2>$6.50</h2>
                </div>

                <div class="card">
                    <img src="images/sweet-onion.jpg" alt="">
                    <div class="info">
                        <h3>Sweet onion</h3>
                        <p class="price">$2.99 / lb</p>
                        <button class="qty">5 lb</button>
                    </div>
                    <h2>$14.95</h2>
                </div>

            </div>

            <div class="summary">

                <h3>Order summary</h3>

                <div class="row">
                    <span>Subtotal</span>
                    <span>$27.44</span>
                </div>

                <div class="row">
                    <span>Shipping</span>
                    <span>$3.99</span>
                </div>

                <div class="row">
                    <span>Tax</span>
                    <span>$2.00</span>
                </div>

                <div class="row total">
                    <span>Total</span>
                    <span>$33.43</span>
                </div>

                <button class="checkout">
                    Continue to payment →
                </button>

            </div>

        </div>

    </div>

</body>
</html>
